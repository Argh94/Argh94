name: Update-GitHub-Profile-Stats

on:
  schedule:
    - cron: "0 18 * * *" # هر روز ساعت 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    name: update-profile-stats
    steps:
      - uses: actions/checkout@v4
      - name: Update README with Stats
        run: |
          # تولید لینک‌های SVG از github-readme-stats
          LIGHT_SVG="https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=light"
          DARK_SVG="https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=dark"
          
          # ذخیره SVG‌ها در پوشه profile-stats
          mkdir -p profile-stats
          curl -s "$LIGHT_SVG" -o profile-stats/light-stats.svg
          curl -s "$DARK_SVG" -o profile-stats/dark-stats.svg
          
          # به‌روزرسانی README با لینک SVG‌ها
          echo "# My GitHub Profile" > README.md
          echo "" >> README.md
          echo "![GitHub Stats Light](profile-stats/light-stats.svg)" >> README.md
          echo "![GitHub Stats Dark](profile-stats/dark-stats.svg)" >> README.md
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update profile stats SVG"; then
            git push
          fi

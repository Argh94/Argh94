name: GitHub-Profile-3D-Contrib-Complete

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # YEAR و SETTING_JSON را فعلاً حذف کردیم

      - name: Commit and Push Generated Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add -A .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update 3D contribution graphs (2026)"
            git pull origin main --rebase
            git push
          fi

  manage-theme:
    runs-on: ubuntu-latest
    name: manage-dynamic-theme
    needs: generate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Copy SVG Files for Dynamic Theme
        run: |
          mkdir -p profile-3d-contrib
          
          if [ -f profile-3d-contrib/profile-green.svg ]; then
            cp profile-3d-contrib/profile-green.svg profile-3d-contrib/light-theme.svg
            echo "✅ Light theme created"
          fi
          
          if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
            cp profile-3d-contrib/profile-night-rainbow.svg profile-3d-contrib/dark-theme.svg
            echo "✅ Dark theme created"
          fi

      - name: Commit and Push Theme Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add -A .
          
          if git diff --staged --quiet; then
            echo "No theme changes"
          else
            git commit -m "chore: update light and dark theme SVGs"
            git pull origin main --rebase
            git push
          fi
